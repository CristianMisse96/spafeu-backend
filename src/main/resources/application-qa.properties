## Seguridad
# Clave secreta para firmar tokens JWT. Debe ser una cadena Base64 de al menos 256 bits.
jwt.secret=${JWT_SECRET:}

## CORS
# Orígenes permitidos separados por comas. Debe coincidir con el dominio del frontend.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

## Cookies
# Indica si la cookie del refresh token requiere conexión HTTPS (true en QA/PROD).
cookie.secure=true

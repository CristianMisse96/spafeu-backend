## JWT / Refresh Token
jwt.refresh-token.expiration-days=7
jwt.access-token.expiration-minutes=15

## Seguridad
# Clave secreta para firmar tokens JWT. En DEV puede dejarse vacía y se generará una clave temporal.
# En QA/PROD debe ser una cadena Base64 de al menos 256 bits.
jwt.secret=${JWT_SECRET:}

## CORS
# Origenes permitidos separados por comas. Debe coincidir con el dominio del frontend.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

## Cookies
# Indica si la cookie del refresh token requiere conexión HTTPS (true en QA/PROD).
cookie.secure=false
app.frontend.url=http://localhost:4200